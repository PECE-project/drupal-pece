services:
  pece_ai.embedding_service:
    class: Drupal\pece_ai\Service\EmbeddingService
    arguments: ['@http_client', '@config.factory']

  pece_ai.similarity_service:
    class: Drupal\pece_ai\Service\SimilarityService
    arguments: ['@http_client', '@config.factory', '@entity_type.manager']

  pece_ai.entity_embed_subscriber:
    class: Drupal\pece_ai\EventSubscriber\EntityEmbedSubscriber
    arguments: ['@queue', '@config.factory']

  pece_ai.activity_event_subscriber:
    class: Drupal\pece_ai\EventSubscriber\ActivityEventSubscriber
    arguments:
      - '@current_user'
      - '@current_route_match'
      - '@config.factory'
      - '@database'
      - '@datetime.time'
    tags:
      - { name: event_subscriber }

  pece_ai.activity_feed_service:
    class: Drupal\pece_ai\Service\ActivityFeedService
    arguments:
      - '@database'
      - '@config.factory'
      - '@pece_ai.similarity_service'
      - '@entity_type.manager'

  pece_ai.commands:
    class: Drupal\pece_ai\Commands\PeceAiCommands
    arguments:
      - '@entity_type.manager'
      - '@queue'
      - '@pece_ai.embedding_service'
      - '@pece_ai.similarity_service'
      - '@config.factory'
    tags:
      - { name: drush.command }
